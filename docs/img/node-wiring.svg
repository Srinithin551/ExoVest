<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="980" height="600" rx="14" fill="#fbfbfd" stroke="#dddde3"/>

  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">ExoVest — Node Wiring</text>
  <text x="490" y="50" text-anchor="middle" font-size="12.5" fill="#6a6a7a">1 ESP32-S3 · 1 TCA9548A (0x70) · 4× ICM-20948 — Main MC is identical but uses only channels 0–1 (2 IMUs)</text>

  <!-- ================= WIRES (drawn first, under boxes) ================= -->
  <!-- 3.3V power: red -->
  <g stroke="#d64545" stroke-width="2.5" fill="none">
    <line x1="330" y1="175" x2="440" y2="175"/>            <!-- 3V -> mux VIN -->
    <polyline points="390,175 390,95 890,95 890,445"/>     <!-- 3.3V bus to IMUs -->
    <line x1="890" y1="160" x2="850" y2="160"/>
    <line x1="890" y1="240" x2="850" y2="240"/>
    <line x1="890" y1="325" x2="850" y2="325"/>
    <line x1="890" y1="410" x2="850" y2="410"/>
    <polyline points="140,290 155,290 155,300 170,300"/>   <!-- battery + -> BAT -->
  </g>
  <!-- GND: black -->
  <g stroke="#333333" stroke-width="2.5" fill="none">
    <line x1="330" y1="445" x2="440" y2="445"/>            <!-- GND -> mux GND -->
    <polyline points="390,445 390,515 915,515 915,160"/>   <!-- GND bus to IMUs -->
    <line x1="915" y1="190" x2="850" y2="190"/>
    <line x1="915" y1="270" x2="850" y2="270"/>
    <line x1="915" y1="355" x2="850" y2="355"/>
    <line x1="915" y1="440" x2="850" y2="440"/>
    <polyline points="140,325 155,325 155,360 170,360"/>   <!-- battery - -> GND -->
  </g>
  <!-- SDA: blue / SCL: yellow (MC <-> mux) -->
  <line x1="330" y1="305" x2="440" y2="305" stroke="#2b7bd6" stroke-width="2.5"/>
  <line x1="330" y1="365" x2="440" y2="365" stroke="#e0a417" stroke-width="2.5"/>

  <!-- Channels: each carries SDA(blue)+SCL(yellow) to one IMU -->
  <g stroke-width="2" fill="none">
    <line x1="610" y1="172" x2="700" y2="167" stroke="#2b7bd6"/><line x1="610" y1="178" x2="700" y2="183" stroke="#e0a417"/>
    <line x1="610" y1="252" x2="700" y2="247" stroke="#2b7bd6"/><line x1="610" y1="258" x2="700" y2="263" stroke="#e0a417"/>
    <line x1="610" y1="337" x2="700" y2="332" stroke="#2b7bd6"/><line x1="610" y1="343" x2="700" y2="348" stroke="#e0a417"/>
    <line x1="610" y1="422" x2="700" y2="417" stroke="#2b7bd6"/><line x1="610" y1="428" x2="700" y2="433" stroke="#e0a417"/>
  </g>
  <g font-size="10.5" fill="#8a8a99" text-anchor="middle">
    <text x="655" y="150">SD0/SC0</text>
    <text x="655" y="230">SD1/SC1</text>
    <text x="655" y="315">SD2/SC2</text>
    <text x="655" y="400">SD3/SC3</text>
  </g>

  <!-- ================= BATTERY ================= -->
  <rect x="30" y="270" width="110" height="70" rx="8" fill="#f0eefb" stroke="#8a7fc0"/>
  <text x="85" y="300" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4a3f80">3.7V LiPo</text>
  <text x="85" y="318" text-anchor="middle" font-size="10.5" fill="#6a6a7a">300–400 mAh</text>
  <text x="146" y="294" font-size="13" font-weight="700" fill="#d64545">+</text>
  <text x="146" y="331" font-size="14" font-weight="700" fill="#333">−</text>

  <!-- ================= ESP32-S3 FEATHER ================= -->
  <rect x="170" y="120" width="160" height="380" rx="10" fill="#eef4ff" stroke="#7fa0d0"/>
  <text x="250" y="145" text-anchor="middle" font-size="13.5" font-weight="700" fill="#274b80">ESP32-S3</text>
  <text x="250" y="162" text-anchor="middle" font-size="11.5" fill="#4a6a9a">Feather</text>
  <!-- left pins -->
  <g font-size="11" fill="#33475b">
    <text x="177" y="304" text-anchor="start">BAT</text>
    <text x="177" y="364" text-anchor="start">GND</text>
  </g>
  <!-- right pins -->
  <g font-size="11" fill="#33475b" text-anchor="end">
    <text x="323" y="179">3V</text>
    <text x="323" y="309">SDA</text>
    <text x="323" y="369">SCL</text>
    <text x="323" y="449">GND</text>
  </g>
  <g fill="#33475b">
    <circle cx="170" cy="300" r="3"/><circle cx="170" cy="360" r="3"/>
    <circle cx="330" cy="175" r="3"/><circle cx="330" cy="305" r="3"/><circle cx="330" cy="365" r="3"/><circle cx="330" cy="445" r="3"/>
  </g>

  <!-- ================= TCA9548A MUX ================= -->
  <rect x="440" y="120" width="170" height="380" rx="10" fill="#fff6e9" stroke="#d0a860"/>
  <text x="525" y="145" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a5a1a">TCA9548A</text>
  <text x="525" y="162" text-anchor="middle" font-size="11.5" fill="#9a7a3a">I²C mux · 0x70</text>
  <!-- left pins -->
  <g font-size="11" fill="#5b4a33" text-anchor="start">
    <text x="447" y="179">VIN</text>
    <text x="447" y="309">SDA</text>
    <text x="447" y="369">SCL</text>
    <text x="447" y="449">GND</text>
  </g>
  <!-- right pins -->
  <g font-size="11" fill="#5b4a33" text-anchor="end">
    <text x="603" y="179">CH0</text>
    <text x="603" y="259">CH1</text>
    <text x="603" y="344">CH2</text>
    <text x="603" y="429">CH3</text>
  </g>
  <g fill="#5b4a33">
    <circle cx="440" cy="175" r="3"/><circle cx="440" cy="305" r="3"/><circle cx="440" cy="365" r="3"/><circle cx="440" cy="445" r="3"/>
    <circle cx="610" cy="175" r="3"/><circle cx="610" cy="255" r="3"/><circle cx="610" cy="340" r="3"/><circle cx="610" cy="425" r="3"/>
  </g>

  <!-- ================= IMUs ================= -->
  <!-- template repeated 4x -->
  <g>
    <rect x="700" y="145" width="150" height="60" rx="8" fill="#eefbf0" stroke="#6db080"/>
    <text x="775" y="181" text-anchor="middle" font-size="12" font-weight="600" fill="#2f6b45">ICM-20948 #0</text>
    <text x="705" y="171" font-size="9.5" fill="#3f7b55">SDA</text><text x="705" y="189" font-size="9.5" fill="#3f7b55">SCL</text>
    <text x="845" y="165" font-size="9.5" fill="#3f7b55" text-anchor="end">VIN</text><text x="845" y="195" font-size="9.5" fill="#3f7b55" text-anchor="end">GND</text>
  </g>
  <g>
    <rect x="700" y="225" width="150" height="60" rx="8" fill="#eefbf0" stroke="#6db080"/>
    <text x="775" y="261" text-anchor="middle" font-size="12" font-weight="600" fill="#2f6b45">ICM-20948 #1</text>
    <text x="705" y="251" font-size="9.5" fill="#3f7b55">SDA</text><text x="705" y="269" font-size="9.5" fill="#3f7b55">SCL</text>
    <text x="845" y="245" font-size="9.5" fill="#3f7b55" text-anchor="end">VIN</text><text x="845" y="275" font-size="9.5" fill="#3f7b55" text-anchor="end">GND</text>
  </g>
  <g>
    <rect x="700" y="310" width="150" height="60" rx="8" fill="#eefbf0" stroke="#6db080"/>
    <text x="775" y="346" text-anchor="middle" font-size="12" font-weight="600" fill="#2f6b45">ICM-20948 #2</text>
    <text x="705" y="336" font-size="9.5" fill="#3f7b55">SDA</text><text x="705" y="354" font-size="9.5" fill="#3f7b55">SCL</text>
    <text x="845" y="330" font-size="9.5" fill="#3f7b55" text-anchor="end">VIN</text><text x="845" y="360" font-size="9.5" fill="#3f7b55" text-anchor="end">GND</text>
  </g>
  <g>
    <rect x="700" y="395" width="150" height="60" rx="8" fill="#eefbf0" stroke="#6db080"/>
    <text x="775" y="431" text-anchor="middle" font-size="12" font-weight="600" fill="#2f6b45">ICM-20948 #3</text>
    <text x="705" y="421" font-size="9.5" fill="#3f7b55">SDA</text><text x="705" y="439" font-size="9.5" fill="#3f7b55">SCL</text>
    <text x="845" y="415" font-size="9.5" fill="#3f7b55" text-anchor="end">VIN</text><text x="845" y="445" font-size="9.5" fill="#3f7b55" text-anchor="end">GND</text>
  </g>

  <!-- ================= LEGEND ================= -->
  <g font-size="11.5" fill="#4a4a5a">
    <rect x="300" y="553" width="16" height="10" rx="2" fill="#d64545"/><text x="322" y="562">3.3V</text>
    <rect x="380" y="553" width="16" height="10" rx="2" fill="#333333"/><text x="402" y="562">GND</text>
    <rect x="455" y="553" width="16" height="10" rx="2" fill="#2b7bd6"/><text x="477" y="562">SDA</text>
    <rect x="530" y="553" width="16" height="10" rx="2" fill="#e0a417"/><text x="552" y="562">SCL</text>
  </g>
</svg>
